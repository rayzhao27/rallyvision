[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rallyvision"
version = "0.1.0"
description = "Tennis ball tracking for Apple Silicon deployment"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["rallyvision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=300"
markers = [
    "slow: tests that are too heavy for the default local run",
    "coreml: requires coremltools and macOS",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]
